<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 66" width="116" height="66">
  <!-- Card Base -->
  <rect x="1" y="1" width="114" height="64" rx="14" fill="#ffffff" stroke="#1f2a37" stroke-width="2" />
  
  <!-- Overlapping Avatars -->
  <!-- Avatar 1 (blue) -->
  <circle cx="28" cy="24" r="12" fill="#86ceff" stroke="#1f2a37" stroke-width="1.5" />
  <!-- Avatar 2 (green) -->
  <circle cx="44" cy="24" r="12" fill="#81c777" stroke="#1f2a37" stroke-width="1.5" />
  <!-- Avatar 3 (purple) -->
  <circle cx="60" cy="24" r="12" fill="#b9a9fe" stroke="#1f2a37" stroke-width="1.5" />
  <!-- Avatar 4 (+) -->
  <circle cx="76" cy="24" r="12" fill="#ffbc7d" stroke="#1f2a37" stroke-width="1.5" />
  <text x="76" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1f2a37" text-anchor="middle">+</text>
  
  <!-- Caption text -->
  <text x="58" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1f2a37" text-anchor="middle">10,000+ Patients</text>
</svg>
